<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predictive DCI Saturation Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:#121a25;
    --panel-2:#0e141d;
    --line:#26303c;
    --line-soft:#1a222c;
    --text:#e7edf3;
    --text-dim:#8695a3;
    --text-faint:#5c6773;
    --accent:#49d3ff;
    --ok:#33d17e;
    --risk:#ff5c6a;
    --missing:#ffb454;
    --font-sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--text);
    font-family:var(--font-sans);
    padding-inline:20px;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding-block:36px 56px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  /* ---------- header ---------- */

  header{display:flex; flex-direction:column; gap:10px;}

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
  }

  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-decoration:none;
    width:fit-content;
  }
  .back:hover{color:var(--accent);}

  h1{
    margin:0;
    font-size:clamp(22px, 4vw, 30px);
    font-weight:700;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }

  .project-desc{
    margin:0;
    color:var(--text);
    font-size:15px;
    max-width:66ch;
    line-height:1.55;
  }

  .subtitle{
    margin:0;
    color:var(--text-dim);
    font-size:13px;
    max-width:66ch;
    line-height:1.55;
  }

  .subtitle code, .note code{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--text);
    background:var(--panel-2);
    border:1px solid var(--line);
    padding:1px 5px;
    border-radius:4px;
  }

  .legend{display:flex; flex-wrap:wrap; gap:10px 20px; margin-top:4px;}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .dot.ok{background:var(--ok);}
  .dot.risk{background:var(--risk);}
  .dot.missing{background:var(--missing);}
  .legend-item b{color:var(--text); font-weight:600;}

  /* ---------- cards ---------- */

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px;}

  .card-head{
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:8px 20px; margin-bottom:16px;
  }
  .card-head h2{margin:0; font-size:15px; font-weight:600; letter-spacing:-0.01em;}
  .card-head .meta{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint);}

  /* ---------- diagram ---------- */

  .diagram-scroll{overflow-x:auto; margin:0 -4px; padding:0 4px;}
  svg.topology{width:1000px; max-width:none; height:auto; display:block;}

  .region-label{font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; fill:var(--text-faint);}

  .node-fill{fill:var(--panel-2);}
  .node-stroke{fill:none; stroke:var(--line); stroke-width:1.5;}
  .node-code{font-family:var(--font-mono); font-size:13px; font-weight:600; fill:var(--text); text-anchor:middle;}
  .node-city{font-family:var(--font-sans); font-size:10.5px; fill:var(--text-faint); text-anchor:middle;}

  .edge-track{stroke:var(--line); stroke-linecap:round; fill:none;}
  .edge-fill{stroke-linecap:round; fill:none;}
  .edge-fill.ok{stroke:var(--ok);}
  .edge-fill.risk{stroke:var(--risk);}
  .edge-fill.missing{stroke:var(--missing);}

  .edge-route{font-family:var(--font-mono); font-size:12.5px; font-weight:600; fill:var(--text);}
  .edge-util{font-family:var(--font-mono); font-size:12px; font-weight:600;}
  .edge-util.ok{fill:var(--ok);}
  .edge-util.risk{fill:var(--risk);}
  .edge-util.missing{fill:var(--missing);}
  .edge-meta{font-family:var(--font-sans); font-size:10.5px; fill:var(--text-faint);}

  a.edge-link{cursor:pointer;}
  a.edge-link:hover .edge-route{fill:var(--accent);}
  a.edge-link:hover .edge-track{stroke:var(--text-faint);}
  a.edge-link:focus-visible{outline:2px solid var(--accent); outline-offset:4px;}

  .hint-chip{
    font-family:var(--font-mono);
    font-size:10px;
    fill:var(--text-faint);
    letter-spacing:0.04em;
  }

  /* ---------- table ---------- */

  .table-scroll{overflow-x:auto;}
  table{width:100%; min-width:820px; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--text-faint); font-weight:500;
    padding:0 12px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:12px; border-bottom:1px solid var(--line-soft); vertical-align:middle; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  td.circuit a{font-family:var(--font-mono); font-size:12.5px; color:var(--text); text-decoration:none; border-bottom:1px dashed var(--text-faint);}
  td.circuit a:hover{color:var(--accent); border-color:var(--accent);}
  td.num{font-variant-numeric:tabular-nums; font-family:var(--font-mono); font-size:12.5px;}
  td.dim{color:var(--text-dim);}
  td.manage a{
    font-family:var(--font-mono); font-size:11.5px; color:var(--accent); text-decoration:none;
  }
  td.manage a:hover{text-decoration:underline;}

  .pill{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px;
    font-weight:600; letter-spacing:0.03em; padding:4px 9px; border-radius:999px; border:1px solid transparent;
  }
  .pill.ok{color:var(--ok); background:rgba(51,209,126,0.12); border-color:rgba(51,209,126,0.3);}
  .pill.risk{color:var(--risk); background:rgba(255,92,106,0.12); border-color:rgba(255,92,106,0.3);}
  .pill.missing{color:var(--missing); background:rgba(255,180,84,0.12); border-color:rgba(255,180,84,0.3);}
  .pill .dot{width:6px; height:6px;}

  .badge-added{
    font-family:var(--font-mono); font-size:10.5px; color:var(--accent);
    background:rgba(73,211,255,0.1); border:1px solid rgba(73,211,255,0.3);
    padding:1px 6px; border-radius:6px; margin-left:6px;
  }

  /* ---------- detail view ---------- */

  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:720px){.detail-grid{grid-template-columns:1fr;}}

  .route-title{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  dl.stat-list{margin:0; display:flex; flex-direction:column; gap:12px;}
  dl.stat-list > div{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  dl.stat-list dt{color:var(--text-dim); font-size:12.5px;}
  dl.stat-list dd{margin:0; font-family:var(--font-mono); font-size:13.5px; text-align:right; font-variant-numeric:tabular-nums;}

  .panel-sub{font-size:11.5px; color:var(--text-faint); margin:-8px 0 14px;}

  label.field-label{
    display:block; font-size:12px; color:var(--text-dim); margin-bottom:8px;
  }

  .bandwidth-input-row{display:flex; gap:10px; align-items:center; margin-bottom:12px;}
  input[type="number"]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--font-mono); font-size:14px; padding:9px 10px; border-radius:8px;
    width:110px;
  }
  .unit-suffix{font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint);}

  .presets{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    font-family:var(--font-mono); font-size:11.5px; padding:6px 10px; border-radius:999px; cursor:pointer;
  }
  .chip-btn:hover{border-color:var(--accent); color:var(--accent);}

  .total-cap{font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
  .total-cap b{color:var(--text); font-family:var(--font-mono);}

  .forecast-box{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px;
  }

  .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .btn{
    font-family:var(--font-mono); font-size:12.5px; font-weight:600; letter-spacing:0.02em;
    padding:10px 16px; border-radius:8px; border:1px solid transparent; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#04141c; border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--text-dim); border-color:var(--line);}
  .btn-ghost:hover{color:var(--text); border-color:var(--text-faint);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .save-note{font-size:11.5px; color:var(--text-faint); margin:10px 0 0; min-height:14px;}
  .save-note.ok{color:var(--ok);}
  .save-note.err{color:var(--risk);}

  .method-note{font-size:11.5px; color:var(--text-faint); line-height:1.6; margin-top:6px;}

  footer{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 20px;
    font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);
    border-top:1px solid var(--line); padding-top:16px;
  }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  // ---- reference data (from the 2026-09-23 pipeline run: Stage 2 forecaster + Stage 3 cross_check) ----
  var THRESHOLD_PCT = 90;                       // src/modeling/forecaster.py DEFAULT_THRESHOLD_PCT
  var MIN_MEANINGFUL_SLOPE_PCT_PER_DAY = 24 / (30 * 24); // src/modeling/trend_fit.py MIN_MEANINGFUL_SLOPE_PCT_PER_HOUR * 24
  var REFERENCE_NOW = new Date("2026-09-23T15:00:00.000Z"); // approx. forecaster generated_at for this snapshot

  // Layout: nodes keep their loose geographic scatter (PDX/SJC/CHI/NYC/
  // DAL/ASH in the North America panel, LON/FRA in Europe), same spirit as
  // the original diagram. Each edge's label anchor + text-anchor direction
  // was chosen, then checked by hand against every node circle (r=24, incl.
  // city-name text) and every other edge's label box, with a real margin --
  // that's what the original version skipped, which is why labels landed on
  // top of nodes.
  var CIRCUITS = [
    {
      id: "DCI-ASH-DAL-W1",
      siteA: { code: "ASH", city: "Ashburn", x: 560, y: 320 },
      siteB: { code: "DAL", city: "Dallas", x: 330, y: 400 },
      linkType: "leased-wave", baseCapacityGbps: 100,
      baseUtilPct: 48.94, baseTrendPctPerDay: 52.078,
      hasPlan: true, plannedUpgradeDate: "2026-10-08T09:54:01.928Z", planNewCapacityGbps: 200,
      labelX: 430, labelY: 318, labelAnchor: "end"
    },
    {
      id: "DCI-SJC-PDX-W2",
      siteA: { code: "SJC", city: "San Jose", x: 140, y: 270 },
      siteB: { code: "PDX", city: "Portland", x: 140, y: 90 },
      linkType: "owned-dark-fiber", baseCapacityGbps: 100,
      baseUtilPct: 88.98, baseTrendPctPerDay: 208.261,
      hasPlan: false, plannedUpgradeDate: null, planNewCapacityGbps: null,
      labelX: 184, labelY: 164, labelAnchor: "start"
    },
    {
      id: "DCI-NYC-CHI-W1",
      siteA: { code: "NYC", city: "New York", x: 560, y: 90 },
      siteB: { code: "CHI", city: "Chicago", x: 360, y: 210 },
      linkType: "leased-wave", baseCapacityGbps: 10,
      baseUtilPct: 69.78, baseTrendPctPerDay: 114.671,
      hasPlan: true, plannedUpgradeDate: "2026-09-23T11:22:10.012Z", planNewCapacityGbps: 40,
      labelX: 437, labelY: 111, labelAnchor: "end"
    },
    {
      id: "DCI-LON-FRA-W1",
      siteA: { code: "LON", city: "London", x: 760, y: 140 },
      siteB: { code: "FRA", city: "Frankfurt", x: 980, y: 260 },
      linkType: "leased-wave", baseCapacityGbps: 100,
      baseUtilPct: 27.21, baseTrendPctPerDay: -0.475,
      hasPlan: false, plannedUpgradeDate: null, planNewCapacityGbps: null,
      labelX: 850, labelY: 150, labelAnchor: "start"
    }
  ];

  CIRCUITS.forEach(function(c){
    c.pos = { a: [c.siteA.x, c.siteA.y], b: [c.siteB.x, c.siteB.y] };
  });

  var byId = {};
  CIRCUITS.forEach(function(c){ byId[c.id] = c; });

  // added-bandwidth state, keyed by circuit id (Gbps on top of baseCapacityGbps)
  var overrides = {};
  CIRCUITS.forEach(function(c){ overrides[c.id] = 0; });
  var readOnly = false;

  // ---- forecasting model ----
  // Mirrors src/modeling/forecaster.py + src/planning/cross_check.py, but
  // driven from each circuit's already-fitted baseline trend rather than
  // raw samples (this static page has no access to telemetry.sqlite).
  // Utilization% = traffic_bps / capacity_bps * 100, so both the current
  // utilization and its slope (pct/day) scale by base_capacity / new_capacity
  // when capacity changes and the underlying traffic growth is unchanged.
  function computeForecast(c, addedGbps){
    addedGbps = Math.max(0, addedGbps || 0);
    var totalCap = c.baseCapacityGbps + addedGbps;
    var scale = c.baseCapacityGbps / totalCap;
    var util = Math.max(0, Math.min(100, c.baseUtilPct * scale));
    var trend = c.baseTrendPctPerDay * scale;

    var daysToSat = null, predictedDate = null;
    if (util >= THRESHOLD_PCT) {
      daysToSat = 0;
      predictedDate = new Date(REFERENCE_NOW.getTime());
    } else if (trend > MIN_MEANINGFUL_SLOPE_PCT_PER_DAY) {
      daysToSat = (THRESHOLD_PCT - util) / trend;
      predictedDate = new Date(REFERENCE_NOW.getTime() + daysToSat * 86400000);
    }

    var status, detail;
    if (predictedDate === null) {
      status = "ok";
      detail = "Not on track to saturate at " + THRESHOLD_PCT + "%.";
    } else if (!c.hasPlan) {
      status = "missing";
      detail = "Predicted to hit " + THRESHOLD_PCT + "% on " + fmtDate(predictedDate) + " \u2014 no augment plan exists.";
    } else {
      var planned = new Date(c.plannedUpgradeDate);
      var slackDays = (planned - predictedDate) / 86400000;
      if (slackDays > 0) {
        status = "risk";
        detail = "Saturates " + fmtDate(predictedDate) + ", " + slackDays.toFixed(1) + "d before the planned upgrade (" + fmtDate(planned) + ").";
      } else {
        status = "ok";
        detail = "Planned upgrade (" + fmtDate(planned) + ") lands " + Math.abs(slackDays).toFixed(1) + "d before predicted saturation (" + fmtDate(predictedDate) + ").";
      }
    }

    return { totalCap: totalCap, util: util, trend: trend, daysToSat: daysToSat, predictedDate: predictedDate, status: status, detail: detail };
  }

  function fmtDate(d){
    return d.toISOString().slice(0, 16).replace("T", " ") + " UTC";
  }
  function fmtCap(g){
    return (Math.round(g * 10) / 10 === Math.round(g) ? String(Math.round(g)) : (Math.round(g * 10) / 10).toFixed(1)) + "G";
  }
  function fmtPct(p){ return p.toFixed(1) + "%"; }
  function fmtTrend(t){ return (t >= 0 ? "+" : "\u2212") + Math.abs(t).toFixed(1) + " pp/day"; }
  function statusLabel(s){ return s === "risk" ? "AT RISK" : s === "missing" ? "MISSING PLAN" : "OK"; }
  function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  // ---- svg topology ----
  function edgeSvg(c){
    var f = computeForecast(c, overrides[c.id]);
    var ax = c.pos.a[0], ay = c.pos.a[1], bx = c.pos.b[0], by = c.pos.b[1];
    var frac = Math.max(0, Math.min(1, f.util / 100));
    var fx = ax + (bx - ax) * frac, fy = ay + (by - ay) * frac;
    var trackW = c.baseCapacityGbps >= 100 ? 7 : 4;
    var fillW = trackW - 0.6;
    var lx = c.labelX, ly = c.labelY;
    var anchorAttr = c.labelAnchor === "end" ? " text-anchor=\"end\"" : "";

    return (
      "<a class=\"edge-link\" href=\"#/circuit/" + encodeURIComponent(c.id) + "\" aria-label=\"" + esc(c.siteA.code) + " to " + esc(c.siteB.code) + ", " + fmtPct(f.util) + " utilization, status " + statusLabel(f.status) + ". Click to manage bandwidth.\">" +
      "<line class=\"edge-track\" x1=\"" + ax + "\" y1=\"" + ay + "\" x2=\"" + bx + "\" y2=\"" + by + "\" stroke-width=\"" + trackW + "\"/>" +
      "<line class=\"edge-fill " + f.status + "\" x1=\"" + ax + "\" y1=\"" + ay + "\" x2=\"" + fx.toFixed(1) + "\" y2=\"" + fy.toFixed(1) + "\" stroke-width=\"" + fillW + "\"/>" +
      "<text class=\"edge-route\"" + anchorAttr + " x=\"" + lx + "\" y=\"" + ly + "\">" + esc(c.siteA.code) + " \u2194 " + esc(c.siteB.code) + "</text>" +
      "<text class=\"edge-util " + f.status + "\"" + anchorAttr + " x=\"" + lx + "\" y=\"" + (ly + 14) + "\">" + fmtPct(f.util) + " util</text>" +
      "<text class=\"edge-meta\"" + anchorAttr + " x=\"" + lx + "\" y=\"" + (ly + 28) + "\">" + esc(c.linkType) + (overrides[c.id] > 0 ? " \u00b7 +" + fmtCap(overrides[c.id]) : "") + "</text>" +
      "</a>"
    );
  }

  function nodeSvg(site){
    var x = site.x, y = site.y;
    return (
      "<circle class=\"node-fill\" cx=\"" + x + "\" cy=\"" + y + "\" r=\"24\"/>" +
      "<circle class=\"node-stroke\" cx=\"" + x + "\" cy=\"" + y + "\" r=\"24\"/>" +
      "<text class=\"node-code\" x=\"" + x + "\" y=\"" + (y + 5) + "\">" + esc(site.code) + "</text>" +
      "<text class=\"node-city\" x=\"" + x + "\" y=\"" + (y + 42) + "\">" + esc(site.city) + "</text>"
    );
  }

  function renderTopologySvg(){
    var ariaParts = CIRCUITS.map(function(c){
      var f = computeForecast(c, overrides[c.id]);
      return c.siteA.code + " to " + c.siteB.code + " at " + fmtPct(f.util) + " (" + statusLabel(f.status) + ")";
    });
    var aria = "Topology of four DCI circuits, each clickable to manage bandwidth: " + ariaParts.join("; ") + ". Line fill length shows current utilization against capacity.";

    var edges = CIRCUITS.map(edgeSvg).join("");
    var nodes = CIRCUITS.map(function(c){ return nodeSvg(c.siteA) + nodeSvg(c.siteB); }).join("");

    return (
      "<svg class=\"topology\" viewBox=\"0 0 1090 480\" role=\"img\" aria-label=\"" + esc(aria) + "\">" +
      "<rect x=\"70\" y=\"30\" width=\"560\" height=\"430\" rx=\"18\" fill=\"var(--panel-2)\" stroke=\"var(--line)\" stroke-width=\"1\"/>" +
      "<text class=\"region-label\" x=\"90\" y=\"56\">NORTH AMERICA</text>" +
      "<rect x=\"700\" y=\"80\" width=\"370\" height=\"240\" rx=\"18\" fill=\"var(--panel-2)\" stroke=\"var(--line)\" stroke-width=\"1\"/>" +
      "<text class=\"region-label\" x=\"720\" y=\"106\">EUROPE</text>" +
      edges + nodes +
      "</svg>"
    );
  }

  // ---- views ----
  function renderTopology(){
    var rows = CIRCUITS.map(function(c){
      var f = computeForecast(c, overrides[c.id]);
      return (
        "<tr>" +
        "<td class=\"circuit\"><a href=\"#/circuit/" + encodeURIComponent(c.id) + "\">" + esc(c.id) + "</a></td>" +
        "<td class=\"dim\">" + esc(c.siteA.code) + " \u2194 " + esc(c.siteB.code) + "</td>" +
        "<td class=\"dim\">" + esc(c.linkType) + "</td>" +
        "<td class=\"num\">" + fmtCap(f.totalCap) + (overrides[c.id] > 0 ? "<span class=\"badge-added\">+" + fmtCap(overrides[c.id]) + "</span>" : "") + "</td>" +
        "<td class=\"num\">" + fmtPct(f.util) + "</td>" +
        "<td class=\"num\">" + fmtTrend(f.trend) + "</td>" +
        "<td class=\"dim\">" + (f.predictedDate ? fmtDate(f.predictedDate).slice(0,10) : "not on track") + "</td>" +
        "<td><span class=\"pill " + f.status + "\"><span class=\"dot " + f.status + "\"></span>" + statusLabel(f.status) + "</span></td>" +
        "<td class=\"manage\"><a href=\"#/circuit/" + encodeURIComponent(c.id) + "\">Add bandwidth \u2192</a></td>" +
        "</tr>"
      );
    }).join("");

    return (
      "<header>" +
        "<span class=\"eyebrow\">Network Operations \u00b7 Snapshot</span>" +
        "<h1>Predictive DCI Saturation Mapper</h1>" +
        "<p class=\"project-desc\">Forecasts when each data-center interconnect circuit will saturate from its streaming telemetry, then cross-checks that forecast against the planned capacity-augment pipeline \u2014 so a scheduling conflict gets flagged before it becomes an outage.</p>" +
        "<p class=\"subtitle\">Point-to-point interconnect map for the demo fleet. Click any circuit \u2014 in the diagram or the table \u2014 to open its detail page and model adding bandwidth; utilization, trend, predicted saturation and status all recalculate from the new capacity. Saturation is defined at <code>" + THRESHOLD_PCT + "%</code> of capacity, matching <code>src/modeling/forecaster.py</code>.</p>" +
        "<div class=\"legend\">" +
          "<span class=\"legend-item\"><span class=\"dot risk\"></span><b>AT RISK</b>&nbsp;\u2014 saturates before its planned upgrade</span>" +
          "<span class=\"legend-item\"><span class=\"dot missing\"></span><b>MISSING PLAN</b>&nbsp;\u2014 saturation predicted, no upgrade scheduled</span>" +
          "<span class=\"legend-item\"><span class=\"dot ok\"></span><b>OK</b>&nbsp;\u2014 upgrade lands in time, or not on track to saturate</span>" +
        "</div>" +
      "</header>" +

      "<div class=\"card\">" +
        "<div class=\"card-head\"><h2>4 circuits \u00b7 8 sites \u00b7 2 regions</h2><span class=\"meta\">session 2026-09-23</span></div>" +
        "<div class=\"diagram-scroll\">" + renderTopologySvg() + "</div>" +
      "</div>" +

      "<div class=\"card\">" +
        "<div class=\"card-head\"><h2>Circuit detail</h2><span class=\"meta\">click a circuit to manage bandwidth</span></div>" +
        "<div class=\"table-scroll\"><table><thead><tr>" +
          "<th>Circuit</th><th>Route</th><th>Link type</th><th>Capacity</th><th>Util.</th><th>Trend</th><th>Predicted sat.</th><th>Status</th><th></th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      "</div>" +

      "<footer><span>Predictive DCI Saturation Mapper \u00b7 Stages 1\u20134</span><span>C:\\Users\\super\\Projects\\Predictive-DCI-Saturation-Mapper</span></footer>"
    );
  }

  function renderDetail(id){
    var c = byId[id];
    if (!c) {
      return "<header><a class=\"back\" href=\"#/\">\u2190 Topology</a><h1>Circuit not found</h1><p class=\"subtitle\">\u201c" + esc(id) + "\u201d isn\u2019t in the demo fleet.</p></header>";
    }
    var base = computeForecast(c, 0);
    var applied = overrides[id] || 0;
    var live = computeForecast(c, applied);

    return (
      "<header>" +
        "<a class=\"back\" href=\"#/\">\u2190 Topology</a>" +
        "<div class=\"route-title\"><h1>" + esc(c.siteA.code) + " \u2194 " + esc(c.siteB.code) + "</h1><span class=\"pill " + live.status + "\" id=\"headStatus\"><span class=\"dot " + live.status + "\"></span>" + statusLabel(live.status) + "</span></div>" +
        "<p class=\"subtitle\">" + esc(c.id) + " \u00b7 " + esc(c.siteA.city) + " \u2194 " + esc(c.siteB.city) + " \u00b7 " + esc(c.linkType) + "</p>" +
      "</header>" +

      "<div class=\"detail-grid\">" +

        "<div class=\"card\">" +
          "<div class=\"card-head\"><h2>Baseline</h2><span class=\"meta\">last pipeline run</span></div>" +
          "<p class=\"panel-sub\">Fixed reference from Stage 2/3 output \u2014 never changes on this page.</p>" +
          "<dl class=\"stat-list\">" +
            "<div><dt>Capacity</dt><dd>" + fmtCap(c.baseCapacityGbps) + "</dd></div>" +
            "<div><dt>Utilization</dt><dd>" + fmtPct(base.util) + "</dd></div>" +
            "<div><dt>Trend</dt><dd>" + fmtTrend(base.trend) + "</dd></div>" +
            "<div><dt>Predicted " + THRESHOLD_PCT + "% saturation</dt><dd>" + (base.predictedDate ? fmtDate(base.predictedDate) : "not on track") + "</dd></div>" +
            "<div><dt>Augment plan</dt><dd>" + (c.hasPlan ? fmtCap(c.planNewCapacityGbps) + " by " + fmtDate(new Date(c.plannedUpgradeDate)).slice(0,10) : "none scheduled") + "</dd></div>" +
            "<div><dt>Status</dt><dd><span class=\"pill " + base.status + "\"><span class=\"dot " + base.status + "\"></span>" + statusLabel(base.status) + "</span></dd></div>" +
          "</dl>" +
        "</div>" +

        "<div class=\"card\">" +
          "<div class=\"card-head\"><h2>Add bandwidth</h2></div>" +
          "<label class=\"field-label\" for=\"addGbpsInput\">Additional capacity, on top of " + fmtCap(c.baseCapacityGbps) + "</label>" +
          "<div class=\"bandwidth-input-row\">" +
            "<input type=\"number\" id=\"addGbpsInput\" min=\"0\" step=\"5\" value=\"" + applied + "\" " + (readOnly ? "disabled" : "") + ">" +
            "<span class=\"unit-suffix\">Gbps</span>" +
          "</div>" +
          "<div class=\"presets\">" +
            "<button type=\"button\" class=\"chip-btn\" data-preset=\"10\" " + (readOnly ? "disabled" : "") + ">+10G</button>" +
            "<button type=\"button\" class=\"chip-btn\" data-preset=\"40\" " + (readOnly ? "disabled" : "") + ">+40G</button>" +
            "<button type=\"button\" class=\"chip-btn\" data-preset=\"100\" " + (readOnly ? "disabled" : "") + ">+100G</button>" +
          "</div>" +
          "<div class=\"total-cap\">New total capacity: <b id=\"calcTotalCap\">" + fmtCap(live.totalCap) + "</b></div>" +

          "<div class=\"forecast-box\">" +
            "<dl class=\"stat-list\">" +
              "<div><dt>Utilization</dt><dd id=\"calcUtil\">" + fmtPct(live.util) + "</dd></div>" +
              "<div><dt>Trend</dt><dd id=\"calcTrend\">" + fmtTrend(live.trend) + "</dd></div>" +
              "<div><dt>Predicted " + THRESHOLD_PCT + "% saturation</dt><dd id=\"calcSaturation\">" + (live.predictedDate ? fmtDate(live.predictedDate) : "not on track") + "</dd></div>" +
              "<div><dt>Status</dt><dd id=\"calcStatus\"><span class=\"pill " + live.status + "\"><span class=\"dot " + live.status + "\"></span>" + statusLabel(live.status) + "</span></dd></div>" +
            "</dl>" +
            "<p class=\"method-note\" id=\"calcDetail\">" + esc(live.detail) + "</p>" +
          "</div>" +

          "<div class=\"actions\">" +
            "<button type=\"button\" class=\"btn btn-primary\" data-apply " + (readOnly ? "disabled" : "") + ">Apply upgrade</button>" +
            "<button type=\"button\" class=\"btn btn-ghost\" data-reset " + (readOnly || applied === 0 ? "disabled" : "") + ">Reset to baseline</button>" +
          "</div>" +
          "<p class=\"save-note\" id=\"saveNote\"></p>" +
          "<p class=\"method-note\">Model: utilization% and trend (pp/day) both scale by base capacity \u00f7 new capacity, i.e. the same traffic growth spread over more bandwidth \u2014 mirrors <code>src/modeling/forecaster.py</code> and <code>src/planning/cross_check.py</code>, anchored to this snapshot rather than a live re-run against raw telemetry.</p>" +
        "</div>" +

      "</div>"
    );
  }

  // ---- routing / render ----
  var app = document.getElementById("app");

  function currentRoute(){
    var h = location.hash.replace(/^#\/?/, "");
    if (h.indexOf("circuit/") === 0) return { view: "detail", id: decodeURIComponent(h.slice(8)) };
    return { view: "topology" };
  }

  function render(){
    var route = currentRoute();
    app.innerHTML = route.view === "detail" ? renderDetail(route.id) : renderTopology();
  }

  window.addEventListener("hashchange", render);

  // live recompute of the "Add bandwidth" panel as the value changes, without a full re-render
  function updateLivePreview(){
    var route = currentRoute();
    if (route.view !== "detail") return;
    var c = byId[route.id];
    if (!c) return;
    var input = document.getElementById("addGbpsInput");
    if (!input) return;
    var addedGbps = Math.max(0, parseFloat(input.value) || 0);
    var f = computeForecast(c, addedGbps);

    var totalCapEl = document.getElementById("calcTotalCap");
    var utilEl = document.getElementById("calcUtil");
    var trendEl = document.getElementById("calcTrend");
    var satEl = document.getElementById("calcSaturation");
    var statusEl = document.getElementById("calcStatus");
    var detailEl = document.getElementById("calcDetail");
    var headStatusEl = document.getElementById("headStatus");
    var resetBtn = document.querySelector("[data-reset]");

    if (totalCapEl) totalCapEl.textContent = fmtCap(f.totalCap);
    if (utilEl) utilEl.textContent = fmtPct(f.util);
    if (trendEl) trendEl.textContent = fmtTrend(f.trend);
    if (satEl) satEl.textContent = f.predictedDate ? fmtDate(f.predictedDate) : "not on track";
    if (statusEl) statusEl.innerHTML = "<span class=\"pill " + f.status + "\"><span class=\"dot " + f.status + "\"></span>" + statusLabel(f.status) + "</span>";
    if (headStatusEl) { headStatusEl.className = "pill " + f.status; headStatusEl.innerHTML = "<span class=\"dot " + f.status + "\"></span>" + statusLabel(f.status); }
    if (detailEl) detailEl.textContent = f.detail;
    if (resetBtn) resetBtn.disabled = readOnly || addedGbps === 0;
  }

  function setSaveNote(text, kind){
    var el = document.getElementById("saveNote");
    if (!el) return;
    el.textContent = text;
    el.className = "save-note" + (kind ? " " + kind : "");
  }

  function persist(circuitId, addedGbps){
    var previous = overrides[circuitId];
    overrides[circuitId] = addedGbps;
    if (!dbNs) return Promise.resolve({ saved: false });
    return dbNs.collection("circuits").doc(circuitId).set({ addedGbps: addedGbps, updatedAt: new Date().toISOString() })
      .then(function(){ return { saved: true }; })
      .catch(function(err){
        overrides[circuitId] = previous;
        if (err && err.code === "invalid_argument") { readOnly = true; }
        throw err;
      });
  }

  app.addEventListener("input", function(e){
    if (e.target && e.target.id === "addGbpsInput") updateLivePreview();
  });

  app.addEventListener("click", function(e){
    var preset = e.target.closest("[data-preset]");
    if (preset) {
      var input = document.getElementById("addGbpsInput");
      if (input) {
        input.value = Math.max(0, (parseFloat(input.value) || 0) + parseFloat(preset.getAttribute("data-preset")));
        updateLivePreview();
      }
      return;
    }
    var applyBtn = e.target.closest("[data-apply]");
    if (applyBtn) {
      var route = currentRoute();
      var input2 = document.getElementById("addGbpsInput");
      var addedGbps = Math.max(0, parseFloat(input2 && input2.value) || 0);
      setSaveNote("Saving\u2026", "");
      persist(route.id, addedGbps).then(function(){
        // hand off to the topology view, now showing the applied change
        location.hash = "#/";
      }).catch(function(){
        setSaveNote("Not saved \u2014 this view may be read-only.", "err");
        render();
      });
      return;
    }
    var resetBtn = e.target.closest("[data-reset]");
    if (resetBtn) {
      var route2 = currentRoute();
      var input3 = document.getElementById("addGbpsInput");
      if (input3) input3.value = 0;
      updateLivePreview();
      setSaveNote("Saving\u2026", "");
      persist(route2.id, 0).then(function(){
        location.hash = "#/";
      }).catch(function(){
        setSaveNote("Not saved \u2014 this view may be read-only.", "err");
        render();
      });
      return;
    }
  });

  // ---- db capability (optional; only available when hosted as a Claude Artifact) ----
  var dbNs = null;
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function(ns){
      dbNs = ns;
      if (!dbNs) return;
      try {
        dbNs.collection("circuits").onSnapshot(function(snap){
          snap.docs.forEach(function(d){
            if (d.exists && byId[d.id]) {
              var data = d.data();
              overrides[d.id] = Math.max(0, Number(data.addedGbps) || 0);
            }
          });
          render();
        }, function(){ /* subscription error: keep working from local state */ });
      } catch (e) { /* ignore */ }
    }).catch(function(){ /* db unavailable: page still works in-memory */ });
  }
})();
</script>
</body>
</html>
